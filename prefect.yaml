# Deployment definitions (Git-managed source of truth for deployments).
# Flow code is baked into the worker image at /opt/research-autopilot; deployments
# only reference it. Deploy from the repo root:
#   GIT_SHA=$(git rev-parse --short HEAD) uv run prefect deploy --all --no-prompt
# The worker image must be built from the same commit (see docs/operations/deployment.md).

name: research-autopilot
prefect-version: 3.8.8

build: null
push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/research-autopilot

definitions:
  work_pool: &research_local
    name: research-local
    work_queue_name: default

deployments:
  - name: manual
    entrypoint: src/research_autopilot/flows/smoke_test.py:smoke_success
    version: "{{ $GIT_SHA }}"
    description: Normal-path smoke test with an idempotent side effect.
    tags: [phase1, smoke]
    work_pool: *research_local
    schedules:
      # Demonstrates scheduled runs. Created INACTIVE; enable only after the
      # operator approves the time/frequency.
      - cron: "0 9 * * *"
        timezone: Asia/Tokyo
        active: false

  - name: retry-check
    entrypoint: src/research_autopilot/flows/smoke_test.py:smoke_failure
    version: "{{ $GIT_SHA }}"
    description: Transient failures with bounded retries; fails by default.
    tags: [phase1, smoke]
    work_pool: *research_local

  - name: timeout-check
    entrypoint: src/research_autopilot/flows/smoke_test.py:smoke_timeout
    version: "{{ $GIT_SHA }}"
    description: Task exceeding its timeout.
    tags: [phase1, smoke]
    work_pool: *research_local

  - name: manual
    entrypoint: src/research_autopilot/flows/smoke_test.py:approval_demo
    version: "{{ $GIT_SHA }}"
    description: Sends an approval-required notification and pauses until resumed.
    tags: [phase1, smoke]
    work_pool: *research_local

  - name: recovery-drill
    entrypoint: src/research_autopilot/flows/smoke_test.py:smoke_sleep
    version: "{{ $GIT_SHA }}"
    description: Long-running run for worker-kill / zombie-detection drills.
    tags: [phase1, smoke]
    work_pool: *research_local

  - name: manual
    entrypoint: src/research_autopilot/orchestrator/flow.py:plan_task_flow
    version: "{{ $GIT_SHA }}"
    description: >-
      Phase 2 task planning. Defaults to dry-run (no external writes).
      Run with -p task_id=INU-123 (or -p next_task=true); -p mode=apply also moves the
      Linear issue to In Progress when RA_LINEAR_WRITE_ENABLED=true on the worker.
    tags: [phase2, planning]
    parameters:
      mode: dry_run
    work_pool: *research_local

  - name: manual
    entrypoint: src/research_autopilot/implementation/flow.py:implement_task_flow
    version: "{{ $GIT_SHA }}"
    description: >-
      Phase 3 implementation of an approved (Phase 2 apply-mode) task in an isolated worktree of a registered
      research repository. Never merges or pushes. -p task_id=INU-123 or -p resume_run_id=<run>.
    tags: [phase3, implementation]
    work_pool: *research_local

  - name: manual
    entrypoint: src/research_autopilot/implementation/flow.py:repair_task_flow
    version: "{{ $GIT_SHA }}"
    description: Phase 4 -> 3 repair from a FailureReport (-p report_path=...).
    tags: [phase3, repair]
    work_pool: *research_local

  - name: manual
    entrypoint: src/research_autopilot/experiments/flow.py:run_experiment_flow
    version: "{{ $GIT_SHA }}"
    description: >-
      Phase 4: run / monitor / validate / analyze the ExperimentSpecs of completed Phase 3 runs
      (-p phase3_run_ids='["<run>"]' or -p resume_run_id=<run>). Never approves proposals.
    tags: [phase4, experiment]
    work_pool: *research_local
